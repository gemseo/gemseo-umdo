[project]
name = "gemseo-umdo"
authors = [
    {name = "Matthias De Lozzo", email = "contact@gemseo.org"}
]
description = "Robust MDO and advanced UQ with GEMSEO."
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
requires-python = ">=3.11, <3.15"
dependencies = [
    "gemseo[all] @ git+https://gitlab.com/gemseo/dev/gemseo.git@develop",
    "matplotlib",
    "numpy",
    "scipy",
]

[dependency-groups]
dev = [
    { include-group = "check" },
    { include-group = "test" },
]
test = [
    "covdefaults >=2.3.0",
    "pytest >=8,<10",
    "pytest-cov >=5",
    "pytest-xdist >=3.6",
    "pytest-sugar >=1",
    "syrupy-matplotlib >=0.3.0",
    "syrupy >=4.7",
    "diff-cover >=10.4,<12",
]
doc = [
    "black",
    "click",
    "griffe-fieldz",
    "griffe-inherited-docstrings",
    "markdown-exec[ansi]",
    "mike",
    "mkdocs <2",
    "mkdocs-bibtex",
    "mkdocs-gallery",
    "mkdocs-gen-files",
    "mkdocs-include-markdown-plugin",
    "mkdocs-literate-nav",
    "mkdocs-macros-plugin",
    "mkdocs-material",
    "mkdocs-section-index",
    "mkdocstrings[python]",
    "mkdocs-autorefs",
    "mkdocs-minify-plugin",
]
check = [
    "prek",
    "ruff",
]
dist = [
    "check-wheel-contents",
]

[project.urls]
Homepage = "https://gemseo.gitlab.io/dev/gemseo-umdo"
Source = "https://gitlab.com/gemseo/dev/gemseo-umdo"
Issues = "https://gitlab.com/gemseo/dev/gemseo-umdo/-/issues"

[project.entry-points]
gemseo_plugins = { gemseo-umdo = "gemseo_umdo" }

[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.uv]
# The project version is derived from the git state by setuptools-scm,
# add that state to the default cache key so that uv rebuilds the project
# when the commit or the tags change.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.uv.sources]
gemseo = { git = "https://gitlab.com/gemseo/dev/gemseo.git", branch = "develop" }
