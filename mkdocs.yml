  logo_suffix: 'umdo'
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/gemseo/dev/gemseo-umdo
      name: gemseo-umdo on GitLab
    - icon: simple/pypi
      link: https://pypi.org/project/gemseo-umdo/
      name: gemseo-umdo on PyPI
    - icon: fontawesome/brands/discourse
      link: https://gemseo.discourse.group/
      name: GEMSEO on Discourse
  # The footer link columns rendered by overrides/partials/footer.html.
  # Each column has an optional `title` (heading shown above the column)
  # and `links`, each link having a `title` and EXACTLY ONE of:
  #   href    external absolute URL (opens in a new tab)
  #   page    site-relative page path (resolved via the `url` filter)
  #   mailto  email address (rendered as a mailto: link)
  footer:
    columns:
      - links:
          - { title: Overview, page: "" }
          - { title: Changelog, page: changelog/ }
          - { title: Licenses, page: licenses/ }
          - { title: Credits, page: credits/ }
      - links:
          - { title: Source code, href: "https://gitlab.com/gemseo/dev/gemseo-umdo" }
          - { title: Issue tracker, href: "https://gitlab.com/gemseo/dev/gemseo-umdo/-/issues" }
          - { title: PyPI, href: "https://pypi.org/project/gemseo-umdo/" }
      - links:
          - { title: GEMSEO, href: https://gemseo.org/ }
          - { title: Plugins, href: https://gemseo.org/plugins/catalog/ }
          - { title: Discussion forum, href: https://gemseo.discourse.group/ }
          - { title: Contact us, mailto: "contact@gemseo.org" }
