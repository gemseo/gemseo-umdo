[project]
name = "gemseo-docs"
version = "0.1.0"
description = "Python-Markdown extensions used by the documentation of GEMSEO."
license = "LGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "markdown",
    "pybtex",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
