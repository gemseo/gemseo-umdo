  api-autonav:
    modules: [src/gemseo_umdo]
    nav_section_title: API documentation
  mike:
    canonical_version: latest
    # Gitlab pages expects the docs in this directory.
    deploy_prefix: public
  mkdocstrings:
    handlers:
      python:
        paths: [src]
        inventories:
        - https://docs.python.org/3/objects.inv
        - https://gemseo.gitlab.io/dev/gemseo/develop/objects.inv
        - https://matplotlib.org/stable/objects.inv
        - https://numpy.org/doc/stable/objects.inv
        - https://docs.scipy.org/doc/scipy/objects.inv
        - https://openturns.github.io/openturns/latest/objects.inv
        - https://scikit-learn.org/stable/objects.inv
        options:
          extensions:
          - griffe_inherited_docstrings
          - docstring_inheritance.griffe
          - griffe_fieldz: {include_inherited: true}
          filters:
          - "!^_"
          docstring_options:
            # ignore_init_summary: true
            returns_multiple_items: False
          docstring_section_style: spacy
          # heading_level: 1
          inherited_members: true
          # preload_modules:
          # - gemseo
          merge_init_into_class: true
          separate_signature: true
          show_root_heading: true
          show_root_full_path: false
          show_signature_annotations: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          show_category_heading: true
          signature_crossrefs: true

markdown_extensions:
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.arithmatex:
    generic: true
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
- footnotes
- toc:
    permalink: true
# Fail the build when an included file is missing,
# e.g. _docs/credits.md when docs-tools prebuild did not run.
- pymdownx.snippets:
    check_paths: true
- pymdownx.emoji:
    emoji_index: !!python/name:zensical.extensions.emoji.twemoji
    emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
# Replace the [@key] citations by footnotes (the mkdocs-bibtex plugin is not supported by Zensical).
- docs_tools.bibtex_citations:
    bib_file: docs/references.bib

