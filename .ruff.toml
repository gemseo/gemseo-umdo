[lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"*.ipynb" = ["RET504"]
"tests/*.py" = ["D", "PT009", "PT011", "PT027", "PTH"]
"docs/*.py" = [
  "T",
  "D",
  "B018",
  "PTH",
  "E501",
  "PERF",
  "A001",
  "RET504",
  "INP001",
]

[format]
docstring-code-format = true
docstring-code-line-length = 75
